<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="../img/logo.png">
    <title>Iniciar Sesión - Futbol5</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>

<div class="auth">
    <div class="auth-card">
        <div class="auth-logo">
            <img src="../img/logo.png" alt="Futbol5">
            <h1>FUTBOL5</h1>
            <p>Iniciá sesión para continuar</p>
        </div>

        <div class="auth-error" style="display:none;">
            Email o contraseña incorrectos. Intentá de nuevo.
        </div>

        <form>
            <div class="form-group">
                <label>Email</label>
                <input type="email" placeholder="tu@email.com" required>
            </div>

            <div class="form-group">
                <label>Contraseña</label>
                <input type="password" placeholder="••••••••" required>
            </div>

            <div class="auth-check">
                <input type="checkbox" id="remember">
                <label for="remember">Recordarme</label>
            </div>

            <button type="submit" class="btn btn-primary btn-full btn-lg">Iniciar Sesión</button>
        </form>

        <div class="auth-footer">
            <p>¿No tenés cuenta? <a href="register.html">Registrate acá</a></p>
            <p><a href="../index.html">← Volver al inicio</a></p>
        </div>
    </div>
</div>

</body>
</html>
