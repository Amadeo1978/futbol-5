<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="../img/logo.svg">
    <title>Registro - Futbol5</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>

<div class="auth">
    <div class="auth-card">
        <div class="auth-logo">
            <img src="../img/logo.svg" alt="Futbol5">
            <h1>FUTBOL5</h1>
            <p>Creá tu cuenta gratuita</p>
        </div>

        <form>
            <div class="form-row">
                <div class="form-group">
                    <label>Nombre</label>
                    <input type="text" placeholder="Juan" required>
                </div>
                <div class="form-group">
                    <label>Apellido</label>
                    <input type="text" placeholder="Pérez" required>
                </div>
            </div>

            <div class="form-group">
                <label>Email</label>
                <input type="email" placeholder="tu@email.com" required>
            </div>

            <div class="form-group">
                <label>Teléfono</label>
                <input type="tel" placeholder="+54 9 11 1234-5678" required>
            </div>

            <div class="form-group">
                <label>Contraseña</label>
                <input type="password" placeholder="Mínimo 6 caracteres" required>
            </div>

            <div class="form-group">
                <label>Confirmar contraseña</label>
                <input type="password" placeholder="••••••••" required>
            </div>

            <div class="auth-check">
                <input type="checkbox" id="terms" required>
                <label for="terms">Acepto el <a href="#">reglamento</a> y los <a href="#">términos</a></label>
            </div>

            <button type="submit" class="btn btn-primary btn-full btn-lg">Crear Cuenta</button>
        </form>

        <div class="auth-footer">
            <p>¿Ya tenés cuenta? <a href="login.html">Iniciá sesión</a></p>
            <p><a href="../index.html">← Volver al inicio</a></p>
        </div>
    </div>
</div>

</body>
</html>
