<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a4a1f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a7a3a;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <!-- Fondo circular -->
  <circle cx="250" cy="250" r="248" fill="url(#bg)"/>
  <circle cx="250" cy="250" r="240" fill="none" stroke="#fff" stroke-width="1" opacity="0.2"/>
  
  <!-- Sombra en el suelo -->
  <ellipse cx="260" cy="430" rx="90" ry="15" fill="#000" opacity="0.25"/>
  
  <!-- JUGADOR SILUETA REALISTA -->
  <g filter="url(#shadow)">
    
    <!-- PIerna izquierda (atrás, estirada hacia atrás) -->
    <!-- Muslo -->
    <path d="M 220 310 Q 195 340 175 370" stroke="#111" stroke-width="22" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Pantorrilla -->
    <path d="M 175 370 Q 165 395 155 420" stroke="#111" stroke-width="16" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Tobillo -->
    <path d="M 155 420 Q 152 428 148 432" stroke="#111" stroke-width="10" fill="none" stroke-linecap="round"/>
    <!-- Pie -->
    <path d="M 148 432 L 130 436 Q 125 438 128 442 L 155 440 Q 160 438 158 434" fill="#111"/>
    
    <!-- PIerna derecha (adelante, flexionada, pateando) -->
    <!-- Muslo -->
    <path d="M 245 305 Q 275 330 295 355" stroke="#111" stroke-width="22" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Pantorrilla -->
    <path d="M 295 355 Q 310 380 320 400" stroke="#111" stroke-width="16" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Tobillo -->
    <path d="M 320 400 Q 325 410 328 415" stroke="#111" stroke-width="10" fill="none" stroke-linecap="round"/>
    <!-- Pie -->
    <path d="M 328 415 L 348 412 Q 355 410 354 416 L 335 420 Q 328 420 326 416" fill="#111"/>
    
    <!-- PELOTA Adidas Tango en el pie derecho -->
    <g transform="translate(360, 405)">
      <circle cx="0" cy="0" r="16" fill="#fff" stroke="#222" stroke-width="1.5"/>
      <!-- Patrón Tango - triángulos negros -->
      <path d="M 0 -12 L -5 -4 L 5 -4 Z" fill="#222"/>
      <path d="M -10 -4 L -14 4 L -4 4 Z" fill="#222"/>
      <path d="M 10 -4 L 14 4 L 4 4 Z" fill="#222"/>
      <path d="M -6 8 L -10 14 L 0 14 Z" fill="#222"/>
      <path d="M 6 8 L 10 14 L 0 14 Z" fill="#222"/>
      <!-- Líneas curvas del Tango -->
      <path d="M -8 -2 Q 0 -8 8 -2" fill="none" stroke="#222" stroke-width="0.8"/>
      <path d="M -6 6 Q 0 12 6 6" fill="none" stroke="#222" stroke-width="0.8"/>
      <!-- Brillo -->
      <circle cx="-4" cy="-6" r="3" fill="#fff" opacity="0.6"/>
    </g>
    
    <!-- TORSO -->
    <!-- Espalda -->
    <path d="M 230 180 Q 225 220 220 260 Q 218 280 220 310" stroke="#111" stroke-width="28" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Pecho -->
    <path d="M 255 180 Q 260 220 258 260 Q 256 280 248 310" stroke="#111" stroke-width="24" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Conexión torso -->
    <path d="M 230 180 L 255 180" stroke="#111" stroke-width="28" fill="none" stroke-linecap="round"/>
    <path d="M 220 310 L 245 305" stroke="#111" stroke-width="24" fill="none" stroke-linecap="round"/>
    
    <!-- CADERA -->
    <ellipse cx="235" cy="310" rx="30" ry="15" fill="#111"/>
    
    <!-- HOMBRO IZQUIERDO -->
    <circle cx="215" cy="185" r="14" fill="#111"/>
    
    <!-- BRAZO IZQUIERDO (atrás, para equilibrio) -->
    <!-- Bíceps -->
    <path d="M 210 190 Q 185 215 170 240" stroke="#111" stroke-width="14" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Antebrazo -->
    <path d="M 170 240 Q 160 260 155 275" stroke="#111" stroke-width="11" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Mano -->
    <path d="M 155 275 Q 150 280 148 278" stroke="#111" stroke-width="8" fill="none" stroke-linecap="round"/>
    
    <!-- HOMBRO DERECHO -->
    <circle cx="260" cy="185" r="14" fill="#111"/>
    
    <!-- BRAZO DERECHO (adelante, pateando) -->
    <!-- Bíceps -->
    <path d="M 265 190 Q 290 210 305 230" stroke="#111" stroke-width="14" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Antebrazo -->
    <path d="M 305 230 Q 315 245 320 255" stroke="#111" stroke-width="11" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Mano -->
    <path d="M 320 255 Q 325 260 323 262" stroke="#111" stroke-width="8" fill="none" stroke-linecap="round"/>
    
    <!-- CUELLO -->
    <path d="M 235 175 Q 237 155 240 140" stroke="#111" stroke-width="16" fill="none" stroke-linecap="round"/>
    
    <!-- CABEZA -->
    <ellipse cx="242" cy="125" rx="22" ry="26" fill="#111"/>
    
    <!-- Pelo (dirección del movimiento) -->
    <path d="M 225 110 Q 220 95 230 85 Q 240 78 250 82 Q 258 86 255 95" fill="#111"/>
    <path d="M 230 105 Q 225 90 235 82 Q 245 76 255 80" fill="#111"/>
    
    <!-- Oreja -->
    <ellipse cx="262" cy="125" rx="5" ry="7" fill="#111"/>
    
  </g>
  
  <!-- Texto -->
  <text x="250" y="480" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="900" fill="#fff" letter-spacing="4">FUTBOL5</text>
</svg>
