<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Cancha de fondo -->
  <rect x="0" y="140" width="200" height="60" rx="0" fill="#2d8a4e"/>
  <line x1="0" y1="140" x2="200" y2="140" stroke="#ffffff" stroke-width="2" opacity="0.5"/>
  <!-- Líneas de la cancha -->
  <line x1="100" y1="140" x2="100" y2="200" stroke="#ffffff" stroke-width="1.5" opacity="0.3"/>
  <circle cx="100" cy="170" r="20" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.3"/>
  
  <!-- CUERVO - Cuerpo -->
  <ellipse cx="100" cy="115" rx="28" ry="35" fill="#1a1a1a"/>
  
  <!-- Cuello -->
  <path d="M95 80 Q90 55 95 35" stroke="#1a1a1a" stroke-width="18" fill="none" stroke-linecap="round"/>
  
  <!-- Cabeza -->
  <circle cx="95" cy="30" r="18" fill="#1a1a1a"/>
  
  <!-- Ojo -->
  <circle cx="88" cy="26" r="5" fill="#ffffff"/>
  <circle cx="87" cy="25" r="2.5" fill="#000000"/>
  <circle cx="86" cy="24" r="1" fill="#ffffff"/>
  
  <!-- Pico -->
  <path d="M78 32 L62 30 L78 26" fill="#ff8c00"/>
  
  <!-- Ala izquierda (pliegada) -->
  <path d="M72 95 Q55 105 50 130 Q55 125 72 115 Q65 110 62 125 Q68 118 75 110" fill="#2a2a2a" stroke="#1a1a1a" stroke-width="1"/>
  
  <!-- Ala derecha (pliegada) -->
  <path d="M128 95 Q145 105 150 130 Q145 125 128 115 Q135 110 138 125 Q132 118 125 110" fill="#2a2a2a" stroke="#1a1a1a" stroke-width="1"/>
  
  <!-- Cola -->
  <path d="M100 148 Q110 155 125 150 Q115 160 100 155" fill="#1a1a1a"/>
  
  <!-- Pata izquierda -->
  <line x1="88" y1="145" x2="85" y2="165" stroke="#ff8c00" stroke-width="4" stroke-linecap="round"/>
  <path d="M78 165 L85 165 L92 165 M80 168 L85 165 L90 168" stroke="#ff8c00" stroke-width="3" fill="none" stroke-linecap="round"/>
  
  <!-- Pata derecha (levantada con pelota) -->
  <line x1="112" y1="140" x2="130" y2="155" stroke="#ff8c00" stroke-width="4" stroke-linecap="round"/>
  <path d="M123 152 L130 155 L137 152 M125 158 L130 155 L135 158" stroke="#ff8c00" stroke-width="3" fill="none" stroke-linecap="round"/>
  
  <!-- Pelota de fútbol -->
  <circle cx="142" cy="148" r="12" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
  <!-- Pentagonos de la pelota -->
  <path d="M142 138 L137 142 L139 148 L145 148 L147 142 Z" fill="#333"/>
  <path d="M133 144 L137 142 L139 148 L135 150 Z" fill="#333"/>
  <path d="M151 144 L147 142 L145 148 L149 150 Z" fill="#333"/>
  <path d="M137 153 L139 148 L145 148 L147 153 L142 156 Z" fill="#333"/>
  
  <!-- Brillo en el ojo -->
  <circle cx="90" cy="23" r="1" fill="#ffffff" opacity="0.8"/>
</svg>
