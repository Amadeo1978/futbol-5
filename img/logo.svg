<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a5f;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#2d5a87;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4a90c4;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="mountainGradient1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2d5a87;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e3a5f;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="mountainGradient2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3d7ab5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d5a87;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grassGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#228B22;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a6b1a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="ballGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f0f0f0;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Fondo del cielo -->
  <rect x="0" y="0" width="400" height="300" fill="url(#skyGradient)"/>

  <!-- Montañas traseras -->
  <polygon points="0,200 80,100 160,180 200,120 280,170 350,90 400,160 400,250 0,250" fill="url(#mountainGradient1)" opacity="0.7"/>
  
  <!-- Montañas delanteras -->
  <polygon points="0,220 60,140 120,200 180,130 240,190 320,110 400,180 400,250 0,250" fill="url(#mountainGradient2)" opacity="0.85"/>

  <!-- Nieve en las montañas -->
  <polygon points="75,105 85,100 95,110" fill="white" opacity="0.9"/>
  <polygon points="195,135 205,130 215,140" fill="white" opacity="0.9"/>
  <polygon points="315,115 325,110 335,120" fill="white" opacity="0.9"/>

  <!-- Cesped -->
  <ellipse cx="200" cy="260" rx="180" ry="40" fill="url(#grassGradient)"/>
  <ellipse cx="200" cy="265" rx="160" ry="30" fill="#2d8a2d"/>

  <!-- Lineas del campo -->
  <ellipse cx="200" cy="260" rx="120" ry="20" fill="none" stroke="white" stroke-width="1.5" opacity="0.6"/>
  <line x1="200" y1="240" x2="200" y2="280" stroke="white" stroke-width="1.5" opacity="0.6"/>

  <!-- Botin izquierdo -->
  <g transform="translate(120, 180) rotate(-15)" filter="url(#shadow)">
    <!-- Suela -->
    <rect x="0" y="45" width="65" height="12" rx="3" fill="#1a1a1a"/>
    <!-- Tacos -->
    <rect x="5" y="52" width="6" height="6" rx="1" fill="#333"/>
    <rect x="15" y="52" width="6" height="6" rx="1" fill="#333"/>
    <rect x="25" y="52" width="6" height="6" rx="1" fill="#333"/>
    <rect x="35" y="52" width="6" height="6" rx="1" fill="#333"/>
    <rect x="45" y="52" width="6" height="6" rx="1" fill="#333"/>
    <rect x="55" y="52" width="6" height="6" rx="1" fill="#333"/>
    <!-- Cuerpo del botin -->
    <path d="M5,10 Q5,0 15,0 L50,0 Q60,0 60,10 L60,45 L5,45 Z" fill="#228B22"/>
    <!-- Detalles -->
    <path d="M10,15 L55,15" stroke="#1a6b1a" stroke-width="2"/>
    <path d="M10,25 L55,25" stroke="#1a6b1a" stroke-width="2"/>
    <!-- Cordones -->
    <line x1="20" y1="5" x2="45" y2="5" stroke="white" stroke-width="2"/>
    <line x1="20" y1="10" x2="45" y2="10" stroke="white" stroke-width="2"/>
    <!-- Logo Nike -->
    <path d="M25,30 Q35,25 45,32" stroke="white" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Botin derecho -->
  <g transform="translate(215, 175) rotate(15)" filter="url(#shadow)">
    <!-- Suela -->
    <rect x="0" y="45" width="65" height="12" rx="3" fill="#1a1a1a"/>
    <!-- Tacos -->
    <rect x="5" y="52" width="6" height="6" rx="1" fill="#333"/>
    <rect x="15" y="52" width="6" height="6" rx="1" fill="#333"/>
    <rect x="25" y="52" width="6" height="6" rx="1" fill="#333"/>
    <rect x="35" y="52" width="6" height="6" rx="1" fill="#333"/>
    <rect x="45" y="52" width="6" height="6" rx="1" fill="#333"/>
    <rect x="55" y="52" width="6" height="6" rx="1" fill="#333"/>
    <!-- Cuerpo del botin -->
    <path d="M5,10 Q5,0 15,0 L50,0 Q60,0 60,10 L60,45 L5,45 Z" fill="#CC0000"/>
    <!-- Detalles -->
    <path d="M10,15 L55,15" stroke="#990000" stroke-width="2"/>
    <path d="M10,25 L55,25" stroke="#990000" stroke-width="2"/>
    <!-- Cordones -->
    <line x1="20" y1="5" x2="45" y2="5" stroke="white" stroke-width="2"/>
    <line x1="20" y1="10" x2="45" y2="10" stroke="white" stroke-width="2"/>
    <!-- Logo Adidas -->
    <rect x="25" y="28" width="20" height="3" fill="white"/>
    <rect x="28" y="32" width="14" height="3" fill="white"/>
    <rect x="31" y="36" width="8" height="3" fill="white"/>
  </g>

  <!-- Balon de futbol -->
  <g transform="translate(175, 140)" filter="url(#shadow)">
    <circle cx="25" cy="25" r="28" fill="url(#ballGradient)" stroke="#333" stroke-width="2"/>
    <!-- Pentagonos -->
    <polygon points="25,5 32,12 28,22 22,22 18,12" fill="#333"/>
    <polygon points="45,18 50,28 42,35 35,30 38,20" fill="#333"/>
    <polygon points="5,18 0,28 8,35 15,30 12,20" fill="#333"/>
    <polygon points="15,42 22,48 30,48 35,42 28,38 20,38" fill="#333"/>
    <polygon points="40,42 45,35 50,40 48,48 40,48" fill="#333"/>
    <polygon points="10,42 5,35 0,40 2,48 10,48" fill="#333"/>
    <!-- Brillo -->
    <circle cx="18" cy="15" r="5" fill="white" opacity="0.4"/>
  </g>

  <!-- Texto FUTBOL5 -->
  <text x="200" y="55" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="white" text-anchor="middle" filter="url(#shadow)">
    FUTBOL5
  </text>
  
  <!-- Subtitulo -->
  <text x="200" y="80" font-family="Arial, sans-serif" font-size="14" fill="#90EE90" text-anchor="middle">
    Encuentra tu partido
  </text>

  <!-- Estrellas decorativas -->
  <circle cx="50" cy="40" r="2" fill="white" opacity="0.8"/>
  <circle cx="350" cy="35" r="2" fill="white" opacity="0.8"/>
  <circle cx="100" cy="25" r="1.5" fill="white" opacity="0.6"/>
  <circle cx="300" cy="30" r="1.5" fill="white" opacity="0.6"/>
  <circle cx="150" cy="15" r="1" fill="white" opacity="0.5"/>
  <circle cx="250" cy="20" r="1" fill="white" opacity="0.5"/>
</svg>
